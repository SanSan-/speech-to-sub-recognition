# Сценарий собирает дистрибутивы после публикации GitHub Release.

name: Сборка релизных артефактов

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    name: Сборка дистрибутивов
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Установить средство сборки
        run: python -m pip install --disable-pip-version-check "build==1.5.0"

      - name: Собрать sdist и wheel
        run: python -m build --sdist --wheel

      - name: Сохранить дистрибутивы
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

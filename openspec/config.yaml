schema: spec-driven
context: |
  speech-to-sub-recognition: локальное пакетное ASR и SRT/ASS/WebVTT.
  Проектный маршрут: [00-start-here](context/00-start-here.md).
  Среды и ограничения проверок: [инженерные ограничения](specs/engineering-constraints/spec.md).
  Рабочие команды: [README](../README.md#подготовка-сред).
  Публичные параметры: [спецификация интерфейсов](specs/application-interface/spec.md).
  Повтор по кешу: [ART-003](specs/recognition-artifacts/spec.md#requirement-art-003-повтор-без-force); полный force: [ART-004](specs/recognition-artifacts/spec.md#requirement-art-004-полный-обход-при-force).
rules:
  proposal:
    - Потребность, границы и наблюдаемый результат описывай по [общим инструкциям](../AGENTS.md#общие-инструкции); открытые обязательства сохраняй в tasks текущего изменения.
  specs:
    - Общая методика требований находится в [инструкциях](../AGENTS.md#общие-инструкции) и не становится требованием приложения.
    - Принятый контракт, подтверждённую реализацию и открытый разрыв различай по [инструкциям сверки](../AGENTS.md#общие-инструкции).
  design:
    - Архитектурные решения и их жизненный цикл оформляй по [инструкциям](../AGENTS.md#общие-инструкции); связи с компонентами и проверками сохраняй отдельно от ADR.
  tasks:
    - Критерий завершения проверяй по [общим инструкциям](../AGENTS.md#общие-инструкции); очередь и продолжение задачи — по [инструкциям работы агента](../AGENTS.md#общие-инструкции).

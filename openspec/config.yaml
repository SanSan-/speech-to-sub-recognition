schema: spec-driven
context: |
  speech-to-sub-recognition: локальное пакетное ASR и SRT/ASS/WebVTT.
  Первый вход: openspec/context/00-start-here.md.
  Обязательны engineering-governance и reference/python-common.md + project-specific.md.
  Текущий код имеет приоритет при сверке; planned и исторические доказательства разделяются.
  Сохраняй оригиналы; force=true означает новый тяжёлый запуск. Работа с документацией не запускает runtime.
  Автоматические правила работы: project-context CTX-005…008 и engineering-governance SEC-CONTEXT-001…004.
  Методика CTX-009 применяется только по отдельному явному запросу на аудит.
rules:
  proposal:
    - Укажи потребность пользователя, границы и наблюдаемый результат; сохрани принятые открытые задачи.
  specs:
    - Используй SHALL/MUST, Requirement и Scenario WHEN/THEN; важные значения условий задавай явно.
    - Применяй SBE и смысловые формы EARS; не объявляй план реализованным.
  design:
    - Свяжи компоненты реализации, решения, альтернативы и границы доказательств.
  tasks:
    - Для каждой задачи укажи проверяемый результат; не закрывай NOT_RUN.
    - Сохраняй событийную сводку и точный следующий шаг; tasks остаётся единственной очередью.
